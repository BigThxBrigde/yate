# Gitee Go pipeline — run the full pytest suite automatically.
#
# Triggers:
#   - push to master (local pushes, branch merges, PR merges)
#   - a Pull Request targeting master (created / updated)
#
# Prerequisite:
#   click "Enable Gitee Go" once on the repo page (free tier is enough);
#   after that this file takes effect on its own and does nothing before.
#
# Compatibility:
#   Gitee Go's shared runners are Linux-only; the suite itself is
#   cross-platform -- Windows-specific assertions skip automatically (see the
#   sys.platform guards in tests/test_terminal.py), winreg imports are
#   deferred inside functions, Textual pilot end-to-end tests run headless,
#   and the real-LSP subprocess cases spawn a sleep stub via sys.executable
#   instead of requiring a pylsp executable.
#
# Reproduce locally:
#   python -m pip install -e ".[dev]"
#   python -m pytest tests
#   python -m pytest tests --cov=yate --cov-branch --cov-report=term-missing --cov-fail-under=75   # coverage gate
#
# Gate split vs the GitHub side (.github/workflows/test.yml):
#   - the pyright strict gate and the Python 3.13 leg run on GitHub only:
#     pyright pulls an npm-side binary and Gitee Go's shared runners are
#     network-restricted (audit A4 ruling);
#   - neither side enables --require-zh on the changelog gate: zh translation
#     coverage is not a CI blocker (2026-10-07 user decision); the option
#     stays an opt-in local check (released-only semantics: released sections
#     enforced, unreleased sections warn only).

version: '1.0'

name: yate-tests
displayName: yate 单元测试

triggers:
  push:
    branches:
      precise:
        - master
  pr:
    branches:
      precise:
        - master

stages:
  - stage:
      name: test
      displayName: 全量单元测试
      # naturally: no fast-fail override (single stage, single task; default semantics)
      strategy: naturally
      trigger: auto
      steps:
        - step: build@python
          name: pytest
          displayName: 安装依赖并运行 pytest
          # requires-python >= 3.12; Gitee Go shared runners use the 3.12 image
          pythonVersion: '3.12'
          commands:
            - python --version
            - python -m pip install --upgrade pip
            # Changelog gate: fails when CHANGELOG*.md go stale vs git history (stdlib-only tool)
            - python -m tools.changelog check
            # install the package itself plus the test deps (textual, pytest); run from the repo root
            - pip install -e ".[dev]"
            # Textual pilot tests need a non-dumb TERM inside the TTY-less container
            # --cov uses the [tool.coverage.*] config in pyproject; fail-under stays identical
            - TERM=xterm-256color python -m pytest tests --cov=yate --cov-branch --cov-report=term-missing --cov-fail-under=75
