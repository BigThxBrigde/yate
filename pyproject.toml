[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yate"
# Single source of truth: yate/__init__.py __version__ (read by hatchling below).
dynamic = ["version"]
description = "yate - yet another terminal editor, built on Textual"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=8.0",
]

[project.scripts]
yate = "yate.cli:main"

[project.optional-dependencies]
dev = ["pyright>=1.1.400", "pytest>=8.0", "pytest-cov>=5.0"]
# Tree-sitter syntax backend (optional): incremental-quality highlighting for
# languages with an installed grammar pack. Without it yate falls back to the
# built-in regex highlighter.
ts = [
    # Upper bound is deliberate: py-tree-sitter 0.26.0's Windows wheel
    # corrupts the heap while walking parse-tree nodes (deterministic
    # 0xC0000005 in python313.dll during node.start_point/.children access,
    # reproducible on a single-threaded parse+walk). 0.25.x is stable; relax
    # this only after a fixed upstream release is verified.
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-bash>=0.23",
]
# Tooling for the standalone executable builds (pack/yate*.spec); not needed
# to run from source or to build/install the wheel.
# pillow: only for regenerating pack/yate.ico from the logo
# (`python -m tools.pack`); the icon itself is committed, so a normal build
# never touches it -- and tools/pack/icon.py imports Pillow dynamically, so
# type checking works without it too.
build = ["pyinstaller>=6.0", "pillow>=10.0"]

# Type checking is performed by Pylance/pyright (the same engine the VS Code
# Pylance extension uses under the hood). The gate is zero diagnostics in
# strict mode across the package (including bundled extensions) and tests.
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["yate", "tools", "tests"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# NOTE: coverage is opt-in (`pytest --cov`) and the fail-under gate lives in the
# CI workflows, not in addopts.  A ``--cov-fail-under`` in addopts would fail
# every partial run (e.g. `pytest tests/test_config.py`, which covers a fraction
# of the package) even when all selected tests pass.
# Reproduce the CI gate locally:
#   python -m pytest tests --cov=yate --cov-branch --cov-report=term-missing --cov-fail-under=75

[tool.coverage.run]
source = ["yate"]
branch = true
# Only the `python -m yate` shim is exempt: it is a 3-line entry point that only
# a subprocess can execute.  Everything else stays measured -- the suite already
# covers the Textual shell / render layer through the pilot tests (measured
# 92-98% there), so omitting it would hide real numbers rather than avoid fakes.
omit = ["yate/__main__.py"]

[tool.coverage.report]
  show_missing = true
  # skip_covered is deliberately OFF: the report must always list every file,
  # including ones already at 100% -- a "N files skipped due to complete
  # coverage" note hides real numbers and makes report lengths vary.
  # empty __init__.py files would otherwise show up as 0%
skip_empty = true
# The threshold deliberately lives on the CI command lines instead of here:
# coverage.py applies report.fail_under to *every* `--cov` run, and a partial run
# (`pytest tests/test_paths.py --cov=yate` reaches ~0% of the package) would then
# fail even though its tests passed.  CI always runs the full suite, so the gate
# is exact there.
# Measured after the second coverage round (2026-09-23, full suite, branch mode,
# Windows): 90% total (9650 statements / 791 missing, 3310 branches / 381
# missing).  The CI gate *stays* at 75: the two platform legs cover mutually
# exclusive blocks (POSIX vs Windows backends in pty_proc / shells), so the
# Linux total is only observable in CI and the gate must hold on both legs.

[tool.hatch.version]
source = "regex"
path = "yate/__init__.py"
regex = '__version__\s*=\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["yate"]
# Non-Python files inside the package are included in the wheel automatically
# by hatchling: resources/fonts/*.ttf + resources/manual.*.md,
# resources/theme_examples/*.example, docs/*.md (bilingual guides),
# extensions/example_ext.py.example and yaterc.example.

[tool.hatch.build.targets.sdist]
include = ["yate"]
