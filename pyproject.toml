[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yate"
# Single source of truth: yate/__init__.py __version__ (read by hatchling below).
dynamic = ["version"]
description = "yate - yet another terminal editor, built on Textual"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "textual>=8.0",
    "pyperclip>=1.8.2",
]

[project.scripts]
yate = "yate.cli:main"

[project.optional-dependencies]
# dev includes the ts group: the pyright zero-diagnostics merge gate (strict,
# whole repo) needs tree-sitter stubs for tests/test_ts_backend.py and
# yate/editor_syntax/ts_backend/, so a bare `.[dev]` install must type check.
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Parallel test runs (`-n auto`): the Textual pilot suite is wall-clock
    # bound on per-test sleeps, so worker processes scale it near-linearly
    # (measured 2026-10-20: 308s serial -> 95s on 4 workers).
    "pytest-xdist>=3.6",
    "tree-sitter>=0.24,<0.26", # keep in sync with the ts group below
    "tree-sitter-python>=0.23",
    "tree-sitter-bash>=0.23",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-go>=0.25",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-html>=0.23",
    "tree-sitter-css>=0.25",
    "tree-sitter-xml>=0.7",
    "tree-sitter-json>=0.24",
    "tree-sitter-toml>=0.7",
    "tree-sitter-yaml>=0.7",
    "tree-sitter-sql>=0.3",
    "tree-sitter-lua>=0.5",
    "tree-sitter-make>=1.1",
    "tree-sitter-powershell>=0.26",
    "tree-sitter-php>=0.24",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-markdown>=0.5",
    "tree-sitter-zig>=1.1",
    "lupa>=2.0",
    "pymarkdownlnt>=0.9.41,<1.0",
]
# Lua extension support (optional): the Python-Lua bridge for `*.lua`
# extension scripts. Without it yate still runs and every `*.py` extension
# keeps working; loading a `.lua` extension reports an actionable error
# pointing at this extra.
lua = ["lupa>=2.0"]
# Tree-sitter syntax backend (optional): incremental-quality highlighting for
# languages with an installed grammar pack. Without it yate falls back to the
# built-in regex highlighter.
ts = [
    # Upper bound is deliberate: py-tree-sitter 0.26.0's Windows wheel
    # corrupts the heap while walking parse-tree nodes (deterministic
    # 0xC0000005 in python313.dll during node.start_point/.children access,
    # reproducible on a single-threaded parse+walk). 0.25.x is stable; relax
    # this only after a fixed upstream release is verified.
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-bash>=0.23",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-go>=0.25",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-html>=0.23",
    "tree-sitter-css>=0.25",
    "tree-sitter-xml>=0.7",
    "tree-sitter-json>=0.24",
    "tree-sitter-toml>=0.7",
    "tree-sitter-yaml>=0.7",
    "tree-sitter-sql>=0.3",
    "tree-sitter-lua>=0.5",
    "tree-sitter-make>=1.1",
    "tree-sitter-powershell>=0.26",
    "tree-sitter-php>=0.24",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-markdown>=0.5",
    "tree-sitter-zig>=1.1",
]
# Tooling for the standalone executable builds (pack/yate*.spec); not needed
# to run from source or to build/install the wheel.
# pillow: only for regenerating pack/yate.ico from the logo
# (`python -m tools.pack`); the icon itself is committed, so a normal build
# never touches it -- and tools/pack/icon.py imports Pillow dynamically, so
# type checking works without it too.
build = ["pyinstaller>=6.0", "pillow>=10.0"]

# Type checking is performed by Pylance/pyright (the same engine the VS Code
# Pylance extension uses under the hood). The gate is zero diagnostics in
# strict mode across the package (including bundled extensions) and tests.
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportImplicitOverride = "error"
venvPath = "."
venv = ".venv"
# pack/_common.py is ordinary Python and belongs under the same strict gate as
# the rest.  The two .spec files are exec'd as scripts but pyright only analyses
# .py, so they are covered by tests/test_pack_spec.py's AST guards instead.
include = ["yate", "tools", "tests", "pack"]
exclude = ["**/__pycache__", "tools/probes/**"]
# tools/probes/**: one-shot probe/harness scripts migrated out of
# .trae/documents/ (audit A15); legacy code kept as-is, not under the gate.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Unawaited coroutines (e.g. an eager coroutine handed to run_worker whose
# worker never starts) surface as RuntimeWarning; make every one of them a
# hard failure so the leak cannot creep back in.
filterwarnings = ["error::RuntimeWarning"]
# Coverage is opt-in (``pytest --cov``) and stays OUT of addopts: a partial run
# must not pay for instrumentation.  The gate threshold itself is
# ``[tool.coverage.report] fail_under`` (single source of truth, asserted by
# tests/test_gate_config.py), so a bare ``--cov`` reproduces the CI gate.
# Reproduce the CI gate locally:
#   python -m pytest tests --cov=yate --cov-branch --cov-report=term-missing
#   python -m pytest tests/test_config.py --cov=yate --cov-fail-under=0   # partial run

[tool.coverage.run]
source = ["yate"]
branch = true
# Only the `python -m yate` shim is exempt: it is a 3-line entry point that only
# a subprocess can execute.  Everything else stays measured -- the suite already
# covers the Textual shell / render layer through the pilot tests (measured
# 92-98% there), so omitting it would hide real numbers rather than avoid fakes.
omit = ["yate/__main__.py"]

[tool.coverage.report]
  show_missing = true
  # skip_covered is deliberately OFF: the report must always list every file,
  # including ones already at 100% -- a "N files skipped due to complete
  # coverage" note hides real numbers and makes report lengths vary.
  # empty __init__.py files would otherwise show up as 0%
skip_empty = true
# The gate threshold lives HERE (not only on the CI command lines) so a local
# ``pytest tests --cov`` reproduces CI exactly and the value itself is
# regression-tested by tests/test_gate_config.py.  coverage.py applies
# fail_under to *every* ``--cov`` run, so a partial run must opt out with
# ``--cov-fail-under=0`` -- which is why ``--cov`` itself stays opt-in and is
# NOT in addopts (adding it there would tax every keystroke-speed test loop).
fail_under = 75
# Measured after the second coverage round (2026-09-23, full suite, branch mode,
# Windows): 90% total (9650 statements / 791 missing, 3310 branches / 381
# missing).  The gate *stays* at 75: the two platform legs cover mutually
# exclusive blocks (POSIX vs Windows backends in pty_proc / shells), so the
# Linux total is only observable in CI and the gate must hold on both legs.

[tool.hatch.version]
source = "regex"
path = "yate/__init__.py"
regex = '__version__\s*=\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["yate"]
# Non-Python files inside the package are included in the wheel automatically
# by hatchling: resources/fonts/*.ttf + resources/*.tcss + resources/manual.*.md,
# resources/theme_examples/*.example, docs/*.md (bilingual guides),
# extensions/example_ext.py.example and yaterc.example.

[tool.hatch.build.targets.sdist]
include = ["yate"]
