[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yate"
# Single source of truth: yate/__init__.py __version__ (read by hatchling below).
dynamic = ["version"]
description = "yate - yet another terminal editor, built on Textual"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=8.0",
]

[project.scripts]
yate = "yate.cli:main"

[project.optional-dependencies]
dev = ["pyright>=1.1.400", "pytest>=8.0"]
# Tree-sitter syntax backend (optional): incremental-quality highlighting for
# languages with an installed grammar pack. Without it yate falls back to the
# built-in regex highlighter.
ts = [
    # Upper bound is deliberate: py-tree-sitter 0.26.0's Windows wheel
    # corrupts the heap while walking parse-tree nodes (deterministic
    # 0xC0000005 in python313.dll during node.start_point/.children access,
    # reproducible on a single-threaded parse+walk). 0.25.x is stable; relax
    # this only after a fixed upstream release is verified.
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-bash>=0.23",
]
# Tooling for the standalone executable builds (pack/yate*.spec); not needed
# to run from source or to build/install the wheel.
build = ["pyinstaller>=6.0"]

# Type checking is performed by Pylance/pyright (the same engine the VS Code
# Pylance extension uses under the hood). The gate is zero diagnostics in
# strict mode across the package (including bundled extensions) and tests.
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["yate", "tools", "tests"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.version]
source = "regex"
path = "yate/__init__.py"
regex = '__version__\s*=\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["yate"]
# Non-Python files inside the package are included in the wheel automatically
# by hatchling: resources/fonts/*.ttf + resources/manual.*.md,
# resources/theme_examples/*.example, docs/*.md (bilingual guides),
# extensions/example_ext.py.example and yaterc.example.

[tool.hatch.build.targets.sdist]
include = ["yate"]
