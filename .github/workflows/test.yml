# GitHub Actions CI — run the full unittest suite on Linux and Windows.
# GitHub 自动识别 .github/workflows/ 下的文件，推送即生效，无需手动开通。
#
# 触发 / Triggers: push to master, and PRs targeting master.
# 本地复现 / Reproduce locally:
#   pip install -e .
#   python -m unittest discover -s tests
#
# Gitee 自带的流水线在 .workflow/test.yml（仅 Linux），两套配置互不影响。

name: yate-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # 一个平台失败时不要取消另一个平台的结果
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the changelog gate slices version sections from
          # tags / __version__ bumps and cannot work on a shallow clone
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Changelog gate
        # stdlib-only tool: fails when CHANGELOG*.md are stale vs git history
        run: python -m tools.changelog check

      - name: Install package and dependencies
        run: python -m pip install -e .

      - name: Run unittest suite
        # TERM 供 Linux 上的 Textual pilot headless 测试使用；Windows 忽略此项
        env:
          TERM: xterm-256color
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests
