# GitHub Actions CI — run the full pytest suite on Linux and Windows.
# GitHub 自动识别 .github/workflows/ 下的文件，推送即生效，无需手动开通。
#
# 触发 / Triggers: push to master, and PRs targeting master.
# 本地复现 / Reproduce locally:
#   pip install -e ".[dev]"
#   python -m pytest tests
#   python -m pytest tests --cov=yate --cov-branch --cov-report=term-missing --cov-fail-under=75   # 覆盖率门禁
#
# Gitee 自带的流水线在 .workflow/test.yml（仅 Linux），两套配置互不影响。

name: yate-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # 一个平台失败时不要取消另一个平台的结果
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
        # A14: 3.13 只跑 Linux 腿（控制成本）；requires-python >=3.12
        # 从未在 3.13 验证过，tree-sitter <0.26 上界已 pin 3.13 堆损坏
        include:
          - os: ubuntu-latest
            python-version: '3.13'

    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the changelog gate slices version sections from
          # tags / __version__ bumps and cannot work on a shallow clone
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Pin canonical remote for changelog links
        # This repo is mirrored GitHub <- Gitee, but Gitee is the canonical
        # site: the committed CHANGELOG links point to gitee.com/jermaine.
        # The gate renders links from the origin URL, and actions/checkout
        # points origin at the GitHub mirror, which would make every released
        # section look stale. URL-only change — the gate makes no network call.
        run: git remote set-url origin https://gitee.com/jermaine/yate.git

      - name: Changelog gate
        # stdlib-only tool: fails when CHANGELOG*.md are stale vs git history.
        # zh translation coverage is deliberately NOT gated here (2026-10-07
        # user decision): `--require-zh` remains an opt-in local check
        # (released sections only; unreleased gaps warn).
        run: python -m tools.changelog check

      - name: Install package and dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest suite
        # TERM 供 Linux 上的 Textual pilot headless 测试使用；Windows 忽略此项
        # --cov 走 pyproject 的 [tool.coverage.*] 配置；fail-under 与本地/另一套 CI 保持一致
        env:
          TERM: xterm-256color
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest tests --cov=yate --cov-branch --cov-report=term-missing --cov-fail-under=75

  # A4: pyproject.toml 宣称 strict 零诊断是合并门禁，CI 必须实际执行。
  # 独立 job 与 test 并行；changelog gate 保留在 test job 原位，此处不跑。
  lint:
    name: pyright (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and dependencies
        run: python -m pip install -e ".[dev]"
      - name: pyright --version
        # 预热 npm 侧二进制下载（pyright 首跑会拉 node 包，避免算进诊断超时）
        run: pyright --version
      - name: pyright (strict, zero diagnostics)
        run: pyright
