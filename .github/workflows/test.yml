# GitHub Actions CI — run the full pytest suite on Linux and Windows.
# GitHub picks up .github/workflows/ automatically: push to take effect,
# no manual enablement needed.
#
# Triggers: push to master, and PRs targeting master.
# Reproduce locally:
#   pip install -e ".[dev]"
#   python -m pytest tests
#   python -m pytest tests --cov=yate --cov-branch --cov-report=term-missing --cov-fail-under=75   # coverage gate
#
# The Gitee-side pipeline lives in .workflow/test.yml (Linux only);
# the two configs are independent.

name: yate-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # one failing platform must not cancel the other's results
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
        # A14: 3.13 runs on the Linux leg only (cost control);
        # requires-python >=3.12 was never verified on 3.13 before, and the
        # tree-sitter <0.26 pin already guards the 3.13 heap corruption
        include:
          - os: ubuntu-latest
            python-version: '3.13'

    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the changelog gate slices version sections from
          # tags / __version__ bumps and cannot work on a shallow clone
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Pin canonical remote for changelog links
        # This repo is mirrored GitHub <- Gitee, but Gitee is the canonical
        # site: the committed CHANGELOG links point to gitee.com/jermaine.
        # The gate renders links from the origin URL, and actions/checkout
        # points origin at the GitHub mirror, which would make every released
        # section look stale. URL-only change — the gate makes no network call.
        run: git remote set-url origin https://gitee.com/jermaine/yate.git

      - name: Changelog gate
        # stdlib-only tool: fails when CHANGELOG*.md are stale vs git history.
        # zh translation coverage is deliberately NOT gated here (2026-10-07
        # user decision): `--require-zh` remains an opt-in local check
        # (released sections only; unreleased gaps warn).
        run: python -m tools.changelog check

      - name: Install package and dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest suite
        # TERM is for the Textual pilot headless tests on Linux; Windows ignores it.
        # --cov uses the [tool.coverage.*] config in pyproject; fail-under stays
        # identical to local runs and the other CI.
        env:
          TERM: xterm-256color
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest tests --cov=yate --cov-branch --cov-report=term-missing --cov-fail-under=75

  # A4: pyproject.toml declares strict zero-diagnostics as the merge gate, so
  # CI must actually run it.  Separate job, parallel to test; the changelog
  # gate stays in its original place inside the test job.
  lint:
    name: pyright (strict)
    # A Windows runner makes the pyright session platform (which follows the
    # host OS) match the platform the package targets -- see the note on the
    # pyright step below.
    runs-on: windows-latest
    # Windows runners are slower (cold pip + node download); parity with the
    # test job's timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and dependencies
        run: python -m pip install -e ".[dev]"
      - name: pyright --version
        # warm up the npm-side binary download (the first pyright run pulls a
        # node package; keep it out of the diagnostics timeout)
        run: pyright --version
      - name: pyright (strict, zero diagnostics)
        # typeshed gates the Windows-only stubs (ctypes.WinDLL / wintypes /
        # winreg) by the pyright SESSION platform, which follows the runner
        # OS: on a Linux runner the Windows-only modules (pty_proc ConPTY,
        # keyproto driver, fonts registry) fail the zero-diagnostics gate
        # (pipeline #145), so this job runs on a Windows runner and no flag
        # is needed.  The POSIX branches inside shared modules stay covered
        # at runtime by the Linux pytest legs.
        # TODO(future work): Linux-platform lint -- needs the Windows-only
        # modules to type-check cleanly under a POSIX analysis session first.
        run: pyright
